<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post App - Local storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" /> 
</head>
<body class="p-4" onload="checkLoginAndRenderPosts()"> 
    
    <div class="container-fluid">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 header-bg">
            <h1 class="text-light m-0">Post App</h1>
            
            <div class="profile-info text-light d-flex align-items-center">
                <div id="displayData" class="me-3"></div> 
                <button onclick="logout()" class="btn btn-warning">Log Out</button>
            </div>
        </header>

        <div class="container mt-4">

            <div id="formDiv" class="card p-4 shadow mb-4 form-card">
                <h2 class="text-center mb-3">Create New Post</h2>
                <input type="text" id="title" class="form-control mb-2" placeholder="Enter Title" />
                <textarea id="description" class="form-control mb-2" placeholder="Enter Description"></textarea>

                <h6 class="text-center mt-3">Choose a Theme Image</h6>
                <div class="d-flex justify-content-around mb-3">
                    <img onclick="selectImg('assets/img-1.jpg')" class="bgImg selectedImg" src="assets/img-1.jpg" alt="Theme 1">
                    <img onclick="selectImg('assets/img-2.jpg')" class="bgImg" src="assets/img-2.jpg" alt="Theme 2">
                    <img onclick="selectImg('assets/img-3.jpg')" class="bgImg" src="assets/img-3.jpg" alt="Theme 3">
                </div>

                <div class="text-center mt-3">
                    <button onclick="savePost()" class="btn btn-primary" id="postButton">Post</button>
                    <button onclick="changeTheme()" class="btn btn-dark ms-2">Change Theme</button>
                </div>
            </div>

            <div id="postsSection" class="mt-5">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-light">Your Posts</h4>
                    <button onclick="showForm()" class="btn btn-success">+ Add New Post</button>
                </div>
                <div id="posts" class="d-flex flex-wrap justify-content-start">
                    </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script> 
</body>
</html>
