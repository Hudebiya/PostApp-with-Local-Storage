<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Post App — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-dashboard">

  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="mb-0">Your Dashboard</h2>
        <small id="welcomeUser" class="text-muted"></small>
      </div>
      <div>
        <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
      </div>
    </div>

    <div id="formDiv" class="card p-3 shadow mb-4">
      <div class="mb-2">
        <input type="text" id="title" class="form-control" placeholder="Enter Title" />
      </div>
      <div class="mb-2">
        <textarea id="description" class="form-control" rows="3" placeholder="Enter Description"></textarea>
      </div>

      <h6 class="text-center mb-2">Choose a Theme Image</h6>
      <div class="d-flex justify-content-around mb-3">
        <img onclick="selectImg('assets/img-1.jpg', this)" class="bgImg selectedImg" src="assets/img-1.jpg" alt="">
        <img onclick="selectImg('assets/img-2.jpg', this)" class="bgImg" src="assets/img-2.jpg" alt="">
        <img onclick="selectImg('assets/img-3.jpg', this)" class="bgImg" src="assets/img-3.jpg" alt="">
      </div>

      <div class="text-center">
        <button id="postBtn" class="btn btn-primary" onclick="post()">Post</button>
        <button id="updateBtn" class="btn btn-success d-none ms-2" onclick="updatePost()">Update Post</button>
        <button id="cancelEditBtn" class="btn btn-secondary d-none ms-2" onclick="cancelEdit()">Cancel</button>
        <button onclick="changeTheme()" class="btn btn-dark ms-2">Change Theme</button>
      </div>
    </div>

    <div id="postsSection" class="mt-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h4>Your Posts</h4>
      </div>
      <div id="posts" class="row gy-3"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
