<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PostApp — Login / Signup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="auth-container" class="container-morph">

    <div class="form-container sign-in-container">
      <form onsubmit="login(event)">
        <h1>Login</h1>
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPass" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </div>

    <div class="form-container sign-up-container">
      <form onsubmit="signup(event)">
        <h1>Create Account</h1>
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="pass" placeholder="Password" required />
        <input type="password" id="cpass" placeholder="Confirm Password" required />
        <button type="submit">Sign Up</button>
      </form>
    </div>

    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <a href="#"><button class="ghost">Login</button></a>
        </div>

        <div class="overlay-panel overlay-right">
          <h1>Hello!</h1>
          <a href="#signup"><button class="ghost">Signup</button></a>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
