<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostApp with Local Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="signin" class="container-morph">

  <!-- SIGN IN -->
  <div class="form-container sign-in-container">
    <form onsubmit="login(event)">
      <h1>Login</h1>
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPass" placeholder="Password" required />
      <button>Login</button>
    </form>
  </div>

  <!-- SIGN UP -->
  <div class="form-container sign-up-container">
    <form onsubmit="signup(event)">
      <h1>Create Account</h1>
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="pass" placeholder="Password" required />
      <input type="password" id="cpass" placeholder="Confirm Password" required />
      <button>Sign Up</button>
    </form>
  </div>

  <!-- OVERLAY -->
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <a href="#signin"><button class="ghost">Login</button></a>
      </div>

      <div class="overlay-panel overlay-right">
        <h1>Hello!</h1>
        <a href="#signup"><button class="ghost">Signup</button></a>
      </div>
    </div>
  </div>

</div>

    <script src="app.js"></script>
</body>
</html>
