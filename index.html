<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostApp with Local Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container-morph" id="signup">
    
    <div class="form-container sign-up-container" id="signup">
        <form action="/signup" method="POST">
            <h1>Create Account</h1>
            <input type="text"id="name" name="name" placeholder="Name" required/>
            <input type="email" id="email" name="email" placeholder="Email" required/>
            <input type="password" id="password" name="password" placeholder="Password" required/>
            <input type="password" id="cpassword" name="cpassword" placeholder="Confirm Password" required/>
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <div class="form-container sign-in-container" id="signin"> 
        <form action="/login" method="POST">
            <h1>Log In</h1> <input type="email" placeholder="Email" required/>
            <input type="password" placeholder="Password" required/>
            <input type="password" placeholder="Confirm Password" required/> 
            <a href="#">Forgot Your Password?</a>
            <button type="submit">Log In</button> </form>
    </div>

    <div class="overlay-container">
        <div class="overlay">
            
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with your posts, please login with your info.</p>
                <a href="#signin" class="ghost button-link">Log In</a> 
            </div>
            
            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details and start your journey with us.</p>
                <a href="#signup" class="ghost button-link">Sign Up</a>
            </div>
            
        </div>
    </div>
</div>

    <script src="app.js"></script>
</body>
</html>
